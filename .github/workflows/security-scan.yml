name: Security scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: extraccion-service:scan

jobs:
  dependency-audit:
    name: pip-audit (runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit
          uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          pip-audit -r requirements-audit.txt --no-deps --strict --desc on

  image-scan:
    name: Trivy (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build application image
        run: docker build -t "$IMAGE_NAME" .

      - name: Verify image runs as non-root
        run: test "$(docker run --rm --entrypoint id "$IMAGE_NAME" -u)" -ne 0

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          severity: HIGH,CRITICAL
          # Solo falla si la vulnerabilidad ya tiene parche disponible: las CVE sin
          # arreglo de Debian se informan en el reporte pero no bloquean el CI.
          ignore-unfixed: true
          format: table
          exit-code: "1"
