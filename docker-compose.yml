# Test de carga/estrés del extractor (TP Desarrollo de Software - UTN FRSR).
#
# Levanta el extractor con 5 réplicas detrás de un reverse proxy (nginx) que
# balancea la carga, + Redis (caché compartido), con límites de CPU y RAM por
# réplica para igualdad de condiciones. Reproducible con un único comando:
#
#   docker compose up --build
#
# El endpoint queda en:  http://localhost/extract   (POST, PDF binario)
#
# Se usa nginx como balanceador (en vez de Traefik) porque no necesita el socket
# de Docker: resuelve el nombre del servicio "extractor" por el DNS interno de
# Docker, que rota entre las 5 réplicas. El TP permite Traefik o un reverse proxy
# tipo Caddy/nginx.
name: extractor-stress

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"   # gateway (balanceador de las 5 réplicas)
    volumes:
      - ./tests/stress/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - extractor
    restart: unless-stopped
    networks: [web]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [web]

  extractor:
    build:
      context: .
    environment:
      DEBUG: "false"
      # Backend de extracción: pymupdf (rápido) o pypdf (baseline).
      EXTRACTOR_BACKEND: "pymupdf"
      # Workers por réplica (1 CPU por réplica -> 1 worker es lo óptimo).
      EXTRACT_WORKERS: "1"
      # Máx. peticiones admitidas a la vez por réplica (backpressure -> 503).
      MAX_INFLIGHT: "16"
      # Caché compartido entre réplicas.
      CACHE_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      CACHE_TTL_SECONDS: "3600"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [web]

networks:
  web:
