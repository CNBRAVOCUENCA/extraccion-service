# Reverse proxy / balanceador de carga para el extractor.
# Resuelve el nombre "extractor" por el DNS interno de Docker (127.0.0.11),
# que devuelve las IPs de las 5 réplicas rotándolas -> balanceo entre réplicas.
events {
    worker_connections 2048;
}

http {
    # DNS interno de Docker; re-resuelve cada pocos segundos para ver réplicas.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # PDFs de prueba llegan hasta ~9 MB.
    client_max_body_size 25m;

    # Logs a stdout (Twelve-Factor).
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;

        location / {
            set $backend "http://extractor:8000";
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
