[project]
name = "extraccion-service"
version = "0.1.0"
description = "Microservicio de extracción de texto de PDFs (migración de El-Destripador-de-PDFs a microservicios)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=4.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "respx>=0.21.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["App*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
